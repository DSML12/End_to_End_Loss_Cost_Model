name: CI/CD Pipeline
on:
  push:
    branches: [ main ]

env:
  RESOURCE_GROUP: rg-pure-prem
  CONTAINER_APP: model-api
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build, Tag, and Push image
        run: |
          IMAGE_TAG=v1
          REPO=mymodel
          docker build -t $ACR_REGISTRY/$REPO:$IMAGE_TAG -f Dockerfile .
          docker push $ACR_REGISTRY/$REPO:$IMAGE_TAG

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_REGISTRY/mymodel:v1
